<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>møma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --cobalt: #1A4BCC; --cream: #FAF6F1; --text: #111118; --muted: #6F6F88; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #fff; color: var(--text);
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    main { max-width: 420px; }
    .wordmark {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: 40px; color: var(--cobalt); letter-spacing: 0.5px; margin-bottom: 28px;
    }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 30px; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 15.5px; line-height: 1.6; }
    .actions { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block; padding: 15px 24px; border-radius: 100px;
      text-decoration: none; font-weight: 600; font-size: 14.5px; letter-spacing: 0.4px;
    }
    .btn-primary { background: var(--cobalt); color: #fff; }
    .btn-ghost { background: var(--cream); color: var(--cobalt); }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">møma</div>
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div class="actions">
      <a id="open" class="btn btn-primary" href="moma://group-preview"></a>
      <a id="store" class="btn btn-ghost" href="https://apps.apple.com/app/idAPPSTORE_ID_TBD"></a>
    </div>
  </main>

  <script>
    /* The landing target for the "your group is ready" email button.
     *
     * That button used to point here when nothing was here — a 404 at the end
     * of the only email we send at the happiest moment in the product. With
     * /group-preview registered in the AASA, iOS opens the app straight from
     * the email and this page is never seen; it exists for everyone else. */
    var COPY = {
      en: {
        title: 'opening møma…',
        sub: 'if the app didn’t open on its own, tap below. your group is waiting inside.',
        open: 'Open møma',
        store: 'Don’t have the app yet?',
      },
      fr: {
        title: 'ouverture de møma…',
        sub: 'si l’application ne s’est pas ouverte toute seule, appuyez ci-dessous. votre groupe vous attend à l’intérieur.',
        open: 'Ouvrir møma',
        store: 'Vous n’avez pas encore l’application ?',
      },
      es: {
        title: 'abriendo møma…',
        sub: 'si la aplicación no se abrió sola, toca abajo. tu grupo te espera dentro.',
        open: 'Abrir møma',
        store: '¿Aún no tienes la aplicación?',
      },
    };

    (function () {
      var params = new URLSearchParams(location.search);
      var wanted = (params.get('lang') || navigator.language || 'en').slice(0, 2).toLowerCase();
      var c = COPY[wanted] || COPY.en;
      document.documentElement.lang = COPY[wanted] ? wanted : 'en';

      document.getElementById('title').textContent = c.title;
      document.getElementById('sub').textContent = c.sub;
      document.getElementById('open').textContent = c.open;
      document.getElementById('store').textContent = c.store;

      setTimeout(function () { location.href = 'moma://group-preview'; }, 200);
    })();
  </script>
</body>
</html>
