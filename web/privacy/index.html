<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>møma — privacy</title>
  <meta name="description" content="What møma collects, who sees it, and how to have it deleted.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cobalt: #1A4BCC;
      --cream: #FAF6F1;
      --text: #111118;
      --muted: #6F6F88;
      --line: rgba(17,17,24,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #fff;
      color: var(--text);
      line-height: 1.6;
      padding: 40px 24px 80px;
    }
    main { max-width: 620px; margin: 0 auto; }
    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 40px;
      color: var(--cobalt);
      text-align: center;
      letter-spacing: 0.5px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 34px;
      line-height: 1.15;
      margin: 36px 0 14px;
    }
    .lead { color: var(--muted); font-size: 16.5px; margin-bottom: 40px; }
    section { border-top: 1px solid var(--line); padding-top: 26px; margin-top: 26px; }
    h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 25px;
      margin-bottom: 8px;
    }
    p + p { margin-top: 12px; }
    .closing {
      background: var(--cream);
      border-radius: 18px;
      padding: 24px;
      margin-top: 40px;
      font-size: 15.5px;
    }
    footer {
      margin-top: 40px;
      font-size: 13.5px;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--cobalt); }
    .updated { margin-top: 28px; font-size: 13.5px; color: var(--muted); text-align: center; }
    .langs { text-align: center; margin-top: 28px; font-size: 13px; }
    .langs button {
      font: inherit;
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      text-decoration: underline;
    }
    .langs button[aria-current="true"] { color: var(--text); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">møma</div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div id="sections"></div>
    <div class="closing" id="closing"></div>
    <footer>
      <span id="contact"></span>
      <a href="mailto:hello@joinmoma.org">hello@joinmoma.org</a>
    </footer>
    <div class="updated" id="updated"></div>
    <div class="langs">
      <button data-lang="en">English</button>
      <button data-lang="fr">Français</button>
      <button data-lang="es">Español</button>
    </div>
  </main>

  <script>
    // Written from what the app actually does — the column list in the database,

    // analytics SDK. If a claim here stops being true, the code changed and this

    var COPY = {

            "docTitle": "møma — privacy",

                  [
                        "Who is responsible for this data",
                        "møma — Simon Collot, publisher of the service. For any question about your data, or to exercise one of the rights below, write to hello@joinmoma.org. We answer ourselves; there is no department you will be passed to."

                        "What you give us when you sign up",
                        "Your email address — or Apple's relay address, if you choose to hide your own. Your first name, last name and age. Your neighbourhood and address, which we convert once into coordinates to measure a walking distance between you and other mothers: you can type that address, or tap “use my location”, in which case the phone asks your permission and we read your position once, at that moment, to fill the field. We never read it in the background and keep no history of your movements. Your baby's date of birth, or your due date. Your languages. Then, only if you want to: a photo, a few lines about you, your interests, your Instagram handle."
                  ],
                  [
                        "What gets created afterwards, as you use the app",
                        "Your group messages and your private messages. Meetup proposals and your answers to them. Your availability. What you save in Discover, and the places or people you share there. The reason you give when you decline a group — it is what lets us offer you a better one. And a technical identifier from your phone, which lets us send you a notification without knowing who you are."

                  [
                        "What we do not collect, and will not",
                        "No personality, no income, no ethnicity, no religion, no orientation: those questions are not asked and those columns do not exist. The app carries no advertising tracker and no analytics tool — no such library is installed in it, so we do not know which screens you look at or for how long. Nothing is sold, rented, or passed to an advertiser."
                  ],
                  [
                        "Who sees what",
                        "Members of the groups you join see your first name, your photo if you added one, your neighbourhood, your baby's age and whatever you wrote about yourself. Nobody else: a stranger cannot search for you or stumble onto your profile. That is not a display rule, it is enforced by the database itself, row by row. Your private messages stay between you and the person concerned. We, who run the service, have technical access to the database in order to repair and improve it."

            "contact": "A question about your data? Write to us: ",
            "updated": "Last updated: 16 September 2026"
      },

                  ],

                  ]
            ],
            "closing": "møma est en test. Si cette politique change, nous vous le dirons dans l'application — pas par une ligne modifiée en silence sur cette page.",
            "contact": "Une question sur vos données ? Écrivez-nous : ",
            "updated": "Dernière mise à jour : 16 septembre 2026"
      },
      "es": {
            "docTitle": "møma — privacidad",
            "title": "Lo que møma sabe de ti.",
            "lead": "Una aplicación que pone en contacto a madres que viven cerca necesita saber dónde vives y qué edad tiene tu bebé. No necesita nada más. Esta es la lista exacta, lo que hacemos con ella y cómo borrarlo todo.",
            "sections": [
                  [
                        "Quién responde de estos datos",
                        "møma — Simon Collot, editor del servicio. Para cualquier duda sobre tus datos, o para ejercer alguno de los derechos que se describen abajo, escribe a hello@joinmoma.org. Respondemos nosotros mismos; no hay ningún departamento al que te vayan a derivar."
                  ],
                  [
                        "Lo que nos das al registrarte",
                        "Tu dirección de correo — o la dirección de reenvío de Apple, si eliges ocultar la tuya. Tu nombre, tus apellidos y tu edad. Tu barrio y tu dirección, que convertimos una vez en coordenadas para medir una distancia a pie entre tú y otras madres: puedes escribir esa dirección, o tocar «usar mi ubicación», y entonces el teléfono te pide permiso y leemos tu posición una sola vez, en ese momento, para rellenar el campo. Nunca la leemos en segundo plano ni guardamos ningún historial de tus desplazamientos. La fecha de nacimiento de tu bebé, o tu fecha prevista de parto. Tus idiomas. Y después, solo si quieres: una foto, unas líneas sobre ti, tus intereses, tu cuenta de Instagram."

    function render(lang) {
      var c = COPY[lang] || COPY.en;
      document.documentElement.lang = COPY[lang] ? lang : 'en';
      document.title = c.docTitle;
      document.getElementById('title').textContent = c.title;
      document.getElementById('lead').textContent = c.lead;
      document.getElementById('closing').textContent = c.closing;
      document.getElementById('contact').textContent = c.contact;
      document.getElementById('updated').textContent = c.updated;

      var host = document.getElementById('sections');
      host.textContent = '';
      c.sections.forEach(function (pair) {
        var s = document.createElement('section');
        var h = document.createElement('h2');
        h.textContent = pair[0];
        var p = document.createElement('p');
        p.textContent = pair[1];
        s.appendChild(h);
        s.appendChild(p);
        host.appendChild(s);
      });

      Array.prototype.forEach.call(document.querySelectorAll('.langs button'), function (b) {
        b.setAttribute('aria-current', b.dataset.lang === document.documentElement.lang);
      });
    }

    // ?lang= wins (the app links straight to her language), then the browser.
    var wanted = (new URLSearchParams(location.search).get('lang')
      || navigator.language || 'en').slice(0, 2).toLowerCase();
    render(wanted);

    Array.prototype.forEach.call(document.querySelectorAll('.langs button'), function (b) {
      b.addEventListener('click', function () { render(b.dataset.lang); });
    });
  </script>
</body>
</html>
