<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>møma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --cobalt:#1A4BCC; --text:#111118; --muted:#6F6F88; --line:rgba(17,17,24,0.07); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #fff;
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    main { max-width: 420px; text-align: center; }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 40px;
      line-height: 1.1;
      color: var(--cobalt);
      letter-spacing: -0.01em;
    }
    p { margin-top: 20px; color: var(--muted); font-size: 16px; line-height: 1.5; }
    .actions { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px 24px;
      border-radius: 18px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--cobalt); color: #fff; }
    .btn-ghost { background: transparent; color: var(--cobalt); }
    .err { color: #E82030; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="sub"></p>
    <p id="err" class="err" hidden></p>
    <div class="actions">
      <a id="open" class="btn btn-primary" href="#"></a>
      <a id="store" class="btn btn-ghost" href="https://apps.apple.com/app/idAPPSTORE_ID_TBD"></a>
    </div>
  </main>

  <script>
    // Build a moma:// equivalent of the current URL so we can deep-link the
    // already-installed app. Universal Links would have already opened the
    // app — if we're here it means iOS chose to load this page (no app
    // installed, or app not registered for this domain yet).
    var COPY = {
      en: {
        title: 'opening møma…',
        recoveryTitle: 'opening møma…',
        sub: 'if the app didn\u2019t open automatically, tap the button below.',
        open: 'Open møma',
        store: 'Don\u2019t have the app yet?',
        errTitle: 'something went wrong',
        errSub: 'this link is missing its token. try requesting a new email from the app.',
      },
      fr: {
        title: 'ouverture de møma…',
        recoveryTitle: 'ouverture de møma…',
        sub: 'si l\u2019application ne s\u2019est pas ouverte toute seule, appuyez sur le bouton ci-dessous.',
        open: 'Ouvrir møma',
        store: 'Vous n\u2019avez pas encore l\u2019application ?',
        errTitle: 'quelque chose n\u2019a pas fonctionné',
        errSub: 'il manque le jeton de ce lien. demandez un nouvel e-mail depuis l\u2019application.',
      },
      es: {
        title: 'abriendo møma…',
        recoveryTitle: 'abriendo møma…',
        sub: 'si la aplicación no se abrió sola, toca el botón de abajo.',
        open: 'Abrir møma',
        store: '¿Aún no tienes la aplicación?',
        errTitle: 'algo salió mal',
        errSub: 'a este enlace le falta su token. pide un correo nuevo desde la aplicación.',
      },
    };

    (function () {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var deepLink = 'moma://auth/confirm' + search + hash;

      // Language: the email appends ?lang=, which is the language she actually
      // read. Fall back to the browser, then English. This whole page was
      // English regardless — the last screen of a French journey.
      var params = new URLSearchParams(search);
      var wanted = (params.get('lang') || navigator.language || 'en').slice(0, 2).toLowerCase();
      var c = COPY[wanted] || COPY.en;
      document.documentElement.lang = COPY[wanted] ? wanted : 'en';

      // A recovery link is not a confirmation. The <title> said "confirming
      // your email" while she was resetting a password.
      var type = params.get('type') || (hash.match(/type=([^&]+)/) || [])[1] || '';
      document.title = 'møma';

      var openBtn = document.getElementById('open');
      openBtn.href = deepLink;
      openBtn.textContent = c.open;
      document.getElementById('store').textContent = c.store;
      document.getElementById('title').textContent =
        type === 'recovery' ? c.recoveryTitle : c.title;
      document.getElementById('sub').textContent = c.sub;

      var hasParams = hash.length > 1 || search.length > 1;
      if (!hasParams) {
        document.getElementById('title').textContent = c.errTitle;
        document.getElementById('sub').textContent = c.errSub;
        openBtn.style.display = 'none';
        return;
      }

      // Try to deep-link automatically (ignored silently if scheme isn't registered).
      setTimeout(function () { window.location.href = deepLink; }, 200);
    })();
  </script>
</body>
</html>
