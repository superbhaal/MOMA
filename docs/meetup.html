<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>møma · meetups</title>
<style>
  :root{
    --cream:#FAF6F1; --white:#fff; --text:#111118; --muted:#6F6F88;
    --line:rgba(17,17,24,.10); --cobalt:#1A4BCC; --fuchsia:#E8389C;
    --blush:#F4D1D1; --blushText:#6A1A2A; --cherry:#E82030;
    --ok:#E4F7D6; --okText:#3f6b12; --warn:#FFF3CC; --warnText:#8a6d00; --bad:#FBE0E3; --badText:#b3283a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--text);font-size:14px;line-height:1.4}
  h1,h2,h3{margin:0;font-weight:600}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:8px 14px;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--white);width:100%}
  a{color:var(--cobalt)}
  .btn-primary{background:var(--cobalt);color:#fff}
  .btn-ghost{background:var(--white);border:1px solid var(--line);color:var(--text)}
  .hidden{display:none!important}
  .pill{display:inline-block;padding:1px 8px;border-radius:100px;font-size:11px;font-weight:700}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:5px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .card{background:#fff;border-radius:20px;padding:32px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(17,17,24,.12)}
  #login h1{font-size:24px;margin-bottom:4px}
  #login .sub{color:var(--muted);margin-bottom:20px;font-size:13px}
  #login label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:14px 0 6px}
  #login button{width:100%;margin-top:20px;padding:11px}
  #loginErr{color:var(--cherry);font-size:12px;margin-top:10px;min-height:16px}

  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:20px}
  header .grow{flex:1}
  .wrap{max-width:1120px;margin:0 auto;padding:22px}
  .section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px}
  .section h2{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .banner{padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:14px}
  .banner-ok{background:var(--ok);color:var(--okText)}
  .banner-err{background:var(--bad);color:var(--cherry)}
  .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .members{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--cream);border-radius:100px;padding:4px 11px;font-size:12px;display:inline-flex;align-items:center}

  /* availability grid */
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid var(--line);padding:0;text-align:center}
  th{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:6px 4px;font-weight:700}
  td.daylabel{font-size:12px;color:var(--text);padding:4px 8px;white-space:nowrap;text-align:left;font-weight:600}
  .cell{width:100%;height:38px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent}
  .c-ok{background:var(--ok);color:var(--okText)}
  .c-warn{background:var(--warn);color:var(--warnText)}
  .c-bad{background:var(--bad);color:var(--badText)}
  .cell.sel{border-color:var(--cobalt)}
  .legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:5px}

  .place{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
  .place.sel{border-color:var(--cobalt);background:#EEF2FF}
  .place .name{font-weight:600}
  .place .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
  .summary{background:var(--cream);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13px}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>møma meetups</h1>
    <div class="sub">Pick a time & place for a group</div>
    <label for="u">Username</label>
    <input id="u" value="admin_moma" autocomplete="username"/>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password"/>
    <button class="btn-primary" id="loginBtn">Sign in</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>møma <span style="color:var(--muted);font-weight:400">meetups</span></h1>
    <a href="./index.html" style="font-size:13px">← users & matching</a>
    <span class="grow"></span>
    <button class="btn-ghost" id="logoutBtn">Log out</button>
  </header>

  <div class="wrap">
    <div id="banner"></div>

    <div class="section">
      <h2>Group</h2>
      <select id="groupSel"><option value="">Select a group…</option></select>
      <div id="members" class="members" style="margin-top:12px"></div>
    </div>

    <div id="detail" class="hidden">
      <div class="cols">
        <div class="section">
          <h2>Group availability · next 2 weeks</h2>
          <div style="color:var(--muted);font-size:12px;margin-bottom:10px">
            Green = everyone free. Tap a slot to pick it.
          </div>
          <div id="grid"></div>
          <div class="legend">
            <span><i class="sw" style="background:var(--ok)"></i>all free</span>
            <span><i class="sw" style="background:var(--warn)"></i>1 busy</span>
            <span><i class="sw" style="background:var(--bad)"></i>2+ busy</span>
          </div>
        </div>

        <div class="section">
          <h2>Place</h2>
          <div style="color:var(--muted);font-size:12px;margin-bottom:10px">Suggested by the group</div>
          <div id="places"></div>
          <div class="field" style="margin-top:12px">
            <label>Or enter a place manually</label>
            <input id="manualPlace" placeholder="e.g. Café de Jaren, Amsterdam"/>
          </div>
          <div class="field">
            <label>Note (optional)</label>
            <input id="note" placeholder="e.g. strollers welcome, we'll grab the corner table"/>
          </div>

          <div class="summary" id="summary">Pick a time slot and a place.</div>
          <button class="btn-primary" id="dropBtn" style="width:100%;padding:12px" disabled>Drop time & place into the chat</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://rqesqrlrlxetnvihpoxt.supabase.co/functions/v1/admin-api";
const CREDS_KEY = "moma_admin_creds";
const BLOCKS = [["morning","MORNING"],["afternoon","AFTERNOON"],["evening","EVENING"]];
let DATA = null, SELSLOT = null, SELPLACE = null;

const $ = (s)=>document.querySelector(s);
async function api(action, extra={}){
  const res = await fetch(API,{method:"POST",headers:{"content-type":"application/json","x-admin-credentials":sessionStorage.getItem(CREDS_KEY)},body:JSON.stringify({action,...extra})});
  if(res.status===401){logout();throw new Error("Unauthorized");}
  const d = await res.json().catch(()=>({ok:false,error:"bad response"}));
  if(!d.ok) throw new Error(d.error||"request failed");
  return d;
}
function banner(msg,kind="ok"){const b=$("#banner");b.innerHTML=`<div class="banner ${kind==="ok"?"banner-ok":"banner-err"}">${msg}</div>`;setTimeout(()=>b.innerHTML="",kind==="ok"?5000:9000);}

async function tryLogin(){
  sessionStorage.setItem(CREDS_KEY, btoa($("#u").value.trim()+":"+$("#p").value));
  $("#loginErr").textContent="…";
  try{ await api("list_groups"); $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); $("#loginErr").textContent=""; loadGroups(); }
  catch(e){ sessionStorage.removeItem(CREDS_KEY); $("#loginErr").textContent = e.message==="Unauthorized"?"Wrong username or password.":e.message; }
}
function logout(){ sessionStorage.removeItem(CREDS_KEY); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }

async function loadGroups(){
  const d = await api("list_groups");
  const sel = $("#groupSel");
  sel.innerHTML = '<option value="">Select a group…</option>' +
    d.groups.map(g=>`<option value="${g.id}">${g.name} · ${g.city??''} · ${g.member_count} members</option>`).join("");
}

async function loadGroup(gid){
  SELSLOT=null; SELPLACE=null; $("#manualPlace").value=""; $("#note").value="";
  $("#detail").classList.add("hidden");
  if(!gid){ $("#members").innerHTML=""; return; }
  DATA = await api("group_meetup_data",{group_id:gid});
  $("#members").innerHTML = DATA.members.map(m=>`<span class="chip"><i class="dot" style="background:${m.color||'#ccc'}"></i>${m.name}${m.role==='mentor'?' ★':''}</span>`).join("");
  renderGrid(); renderPlaces(); updateSummary();
  $("#detail").classList.remove("hidden");
  if(DATA.open_proposal){
    const p=DATA.open_proposal;
    banner("This group already has an open meetup ("+new Date(p.scheduled_at).toLocaleString()+(p.location_name?" · "+p.location_name:"")+"). Dropping a new one replaces it.","ok");
  }
}

function cellClass(free,total){ const busy=total-free; if(busy<=0) return "c-ok"; if(busy===1) return "c-warn"; return "c-bad"; }
function renderGrid(){
  const byDate = {};
  DATA.grid.forEach(c=>{ (byDate[c.date] ||= {})[c.block]=c; });
  const dates = Object.keys(byDate).sort();
  const total = DATA.member_count;
  let html = '<table><thead><tr><th></th>'+BLOCKS.map(b=>`<th>${b[1]}</th>`).join("")+'</tr></thead><tbody>';
  for(const date of dates){
    const d=new Date(date+"T00:00:00");
    const lbl = d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'});
    html+=`<tr><td class="daylabel">${lbl}</td>`;
    for(const [bk] of BLOCKS){
      const c=byDate[date][bk];
      const sel = SELSLOT && SELSLOT.date===date && SELSLOT.block===bk ? " sel":"";
      html+=`<td><div class="cell ${cellClass(c.free,total)}${sel}" data-date="${date}" data-block="${bk}">${c.free}/${total}</div></td>`;
    }
    html+="</tr>";
  }
  html+="</tbody></table>";
  $("#grid").innerHTML=html;
  $("#grid").querySelectorAll(".cell").forEach(el=>{
    el.onclick=()=>{ SELSLOT={date:el.dataset.date,block:el.dataset.block}; renderGrid(); updateSummary(); };
  });
}

function renderPlaces(){
  const box=$("#places");
  if(!DATA.places.length){ box.innerHTML='<div style="color:var(--muted);font-size:13px">No places shared yet — enter one manually below.</div>'; return; }
  box.innerHTML = DATA.places.map((p,i)=>{
    const sel = SELPLACE && SELPLACE._i===i ? " sel":"";
    return `<div class="place${sel}" data-i="${i}"><div class="name">${p.name||'(unnamed)'}</div><div class="meta">${p.address?p.address+' · ':''}shared by ${p.shared_by}</div></div>`;
  }).join("");
  box.querySelectorAll(".place").forEach(el=>{
    el.onclick=()=>{ const i=+el.dataset.i; SELPLACE={...DATA.places[i],_i:i}; $("#manualPlace").value=""; renderPlaces(); updateSummary(); };
  });
}

function currentPlace(){
  const manual=$("#manualPlace").value.trim();
  if(manual) return { location_name:manual, location_lat:null, location_lng:null };
  if(SELPLACE) return { location_name:SELPLACE.name, location_lat:SELPLACE.lat??null, location_lng:SELPLACE.lng??null };
  return null;
}
function updateSummary(){
  const place=currentPlace();
  const slotTxt = SELSLOT ? new Date(SELSLOT.date+"T00:00:00").toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'})+" · "+SELSLOT.block : "—";
  $("#summary").innerHTML = `<b>When:</b> ${slotTxt}<br><b>Where:</b> ${place? place.location_name : "—"}`;
  $("#dropBtn").disabled = !(SELSLOT && place);
}
$("#manualPlace") && ($("#manualPlace").oninput=()=>{ if($("#manualPlace").value.trim()){SELPLACE=null;renderPlaces();} updateSummary(); });

async function drop(){
  const place=currentPlace();
  if(!SELSLOT||!place) return;
  $("#dropBtn").disabled=true; $("#dropBtn").textContent="Dropping…";
  try{
    const d = await api("create_meetup",{ group_id:$("#groupSel").value, date:SELSLOT.date, block:SELSLOT.block, note:$("#note").value.trim()||null, ...place });
    banner(`Meetup dropped into the chat · pushed to ${d.pushed} member(s).`);
    loadGroup($("#groupSel").value);
  }catch(e){ banner(e.message,"err"); }
  finally{ $("#dropBtn").textContent="Drop time & place into the chat"; }
}

$("#loginBtn").onclick=tryLogin;
$("#p").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
$("#logoutBtn").onclick=logout;
$("#groupSel").onchange=()=>loadGroup($("#groupSel").value);
$("#dropBtn").onclick=drop;

if(sessionStorage.getItem(CREDS_KEY)){
  api("list_groups").then(()=>{ $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); loadGroups(); }).catch(()=>logout());
}
</script>
</body>
</html>
